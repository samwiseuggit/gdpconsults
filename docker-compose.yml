version: '3.8'
services:
  # Frontend - React app served by nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpd-consulting-frontend
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Backend API for email handling
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gpd-consulting-api
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@gdpconsults.ca}
      - TO_EMAIL=${TO_EMAIL:-info@gdpconsults.ca}
      - FRONTEND_URL=${FRONTEND_URL:-https://gdpconsults.ca}
    restart: unless-stopped
